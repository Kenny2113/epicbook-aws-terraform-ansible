---
# Application
app_repo: https://github.com/pravinmishraaws/theepicbook
app_dest: /home/ubuntu/epicbook
app_user: ubuntu
app_port: 8080
pm2_app_name: epicbook

# Nginx
server_name: YOUR_DOMAIN_OR_EC2_PUBLIC_IP

# Managed MySQL database
db_host: YOUR_RDS_ENDPOINT
db_name: epicbook
db_user: epicbook_admin
db_password: "{{ vault_db_password }}"
